<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>古古怪界 · 记忆翻牌</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(#87e0fd, #f9f7c9 60%, #a8e08d);
    min-height: 100vh;
    padding: 16px;
    color: #333;
  }
  h1 {
    text-align: center;
    margin: 8px 0 4px;
    font-size: 22px;
  }
  .info {
    text-align: center;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }
  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .35s ease;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .card.flipped .inner,
  .card.matched .inner {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .face.back {
    background: #5b3cc4;
    color: #fff;
    font-size: 36px;
    font-weight: bold;
  }
  .face.front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card.matched {
    opacity: .85;
  }
  .controls {
    text-align: center;
    margin-top: 16px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: #ff7ab6;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }
  .result {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
    min-height: 22px;
  }
  @media (max-width: 360px) {
    .board { gap: 8px; }
  }
</style>
</head>
<body>

<h1>古古怪界 · 记忆翻牌</h1>
<div class="info">步数：<span id="moves">0</span>　用时：<span id="time">0</span>s</div>

<div class="board" id="board"></div>

<div class="controls">
  <button onclick="init()">重来一局</button>
</div>
<div class="result" id="result"></div>

<script>
const cards = [
  'https://imagetourl.cloud/65i0raqy3xhb.jpg',
  'https://imagetourl.cloud/f7ifdzyzdxeb.jpg',
  'https://imagetourl.cloud/g5qlx1v814jx.jpg',
  'https://imagetourl.cloud/jgu501cca1q2.jpg',
  'https://imagetourl.cloud/jwxoeyt1ssva.jpg',
  'https://imagetourl.cloud/yaweace8ugh7.jpg'
];

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const resultEl = document.getElementById('result');

let flipped = [];
let matchedCount = 0;
let moves = 0;
let timer = null;
let seconds = 0;
let locked = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTimer() {
  if (timer) clearInterval(timer);
  seconds = 0;
  timeEl.textContent = '0';
  timer = setInterval(() => {
    seconds++;
    timeEl.textContent = seconds;
  }, 1000);
}

function stopTimer() {
  if (timer) clearInterval(timer);
}

function init() {
  board.innerHTML = '';
  flipped = [];
  matchedCount = 0;
  moves = 0;
  locked = false;
  movesEl.textContent = '0';
  resultEl.textContent = '';
  stopTimer();

  const pairs = shuffle([...cards, ...cards]);

  pairs.forEach((src, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.src = src;
    card.dataset.idx = idx;

    card.innerHTML = `
      <div class="inner">
        <div class="face back">?</div>
        <div class="face front">
          <img src="${src}" alt="卡牌" />
        </div>
      </div>
    `;

    card.addEventListener('click', () => flip(card));
    board.appendChild(card);
  });

  startTimer();
}

function flip(card) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const same = a.dataset.src === b.dataset.src;

  if (same) {
    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      matchedCount++;
      flipped = [];
      if (matchedCount === cards.length) {
        stopTimer();
        resultEl.textContent = `通关啦！用了 ${moves} 步，${seconds} 秒 ✨（古古怪界胜利）`;
      }
    }, 350);
  } else {
    locked = true;
    setTimeout(() => {
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      flipped = [];
      locked = false;
    }, 700);
  }
}

init();
</script>

</body>
</html>
